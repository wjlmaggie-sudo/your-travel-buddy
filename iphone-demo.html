<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#eff1e9" />
    <title>AiTravel — iPhone demo V1.0</title>
    <link rel="icon" href="./ai-travel-logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&amp;family=Karla:wght@400;600&amp;display=swap" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body { color: #293c32; background: #eff1e9; font-family: "Karla", system-ui, sans-serif; }
      body::before { content: ""; position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 25% 25%, #fffaf0 0, transparent 58%), radial-gradient(ellipse at 90% 85%, #d9e4d6 0, transparent 60%); }
      .demo { position: relative; min-height: 100svh; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; padding: 22px 22px 14px; gap: 18px; }
      .demo-heading { display: flex; align-items: center; justify-content: space-between; gap: 18px; width: min(100%, 920px); margin: auto; }
      .demo-brand { display: flex; align-items: center; gap: 10px; }
      .demo-brand img { width: 32px; height: 32px; }
      .demo-brand strong { font-family: "Fraunces", Georgia, serif; font-size: 20px; font-weight: 600; }
      .demo-brand small { display: block; margin-top: 4px; color: #768072; font-size: 11px; letter-spacing: .02em; }
      .version { flex-shrink: 0; padding: 7px 11px; font-size: 11px; font-weight: 600; color: #45634c; border: 1px solid #ccd6c8; border-radius: 20px; background: #ffffff70; }
      .phone-space { min-height: 280px; display: grid; place-items: center; overflow: visible; }
      .phone-holder { position: relative; width: calc(413px * var(--scale, .75)); height: calc(872px * var(--scale, .75)); }
      .phone { position: absolute; top: 0; left: 0; width: 413px; height: 872px; padding: 10px; border: 1px solid #808780; border-radius: 59px; background: #242a26; box-shadow: inset 0 0 0 3px #4a504b, 0 26px 55px #27382a26, 0 4px 12px #27382a14; transform: scale(var(--scale, .75)); transform-origin: top left; }
      .phone::before { content: ""; position: absolute; left: -4px; top: 150px; width: 3px; height: 30px; border-radius: 3px 0 0 3px; background: #626b63; box-shadow: 0 56px #626b63, 0 96px #626b63; }
      .phone::after { content: ""; position: absolute; right: -4px; top: 211px; width: 3px; height: 66px; border-radius: 0 3px 3px 0; background: #626b63; }
      .display { height: 100%; border-radius: 49px; overflow: hidden; background: #faf6ed; display: grid; grid-template-rows: 54px minmax(0, 1fr) 22px; }
      .status-bar { position: relative; display: flex; align-items: center; justify-content: space-between; padding: 7px 26px 0; color: #1e2923; }
      .time { font-size: 16px; font-weight: 650; letter-spacing: -.5px; }
      .island { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); width: 120px; height: 34px; background: #171c19; border-radius: 25px; box-shadow: inset -6px 0 7px #232d27; }
      .island::after { content: ""; position: absolute; width: 9px; height: 9px; top: 12px; right: 14px; border-radius: 50%; background: #1b2532; box-shadow: inset 0 0 0 2px #121a22; }
      .indicators { display: flex; align-items: center; gap: 6px; }
      .indicators svg { display: block; }
      iframe { display: block; width: 100%; height: 100%; border: 0; background: #faf6ed; }
      .home-area { display: grid; place-items: center; background: #fcf9f1; }
      .home-indicator { width: 122px; height: 4px; margin-top: -2px; border-radius: 5px; background: #27362d; }
      .demo-controls { position: relative; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 14px; font-size: 11px; color: #7c8578; }
      .size-switch { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid #d6ddd0; border-radius: 20px; background: #ffffff60; }
      button { font: inherit; cursor: pointer; color: #66715f; border: 0; background: transparent; border-radius: 16px; min-height: 30px; padding: 5px 11px; }
      button[aria-pressed="true"] { background: #3e5c46; color: white; }
      button:focus-visible, a:focus-visible { outline: 2px solid oklch(0.53 0.13 40); outline-offset: 3px; }
      a { color: #536a54; text-underline-offset: 3px; }
      .full-size .phone-space { padding: 5px; }
      @media (max-width: 480px) {
        .demo { padding: 14px 14px 10px; gap: 13px; }
        .demo-brand strong { font-size: 18px; }
        .demo-brand small { font-size: 10px; }
        .demo-brand img { width: 29px; height: 29px; }
        .demo-controls { gap: 9px; }
        .hint { display: none; }
      }
      @media (prefers-reduced-motion: no-preference) { .phone-holder { transition: width .2s ease, height .2s ease; } }
    </style>
  </head>
  <body>
    <main class="demo">
      <header class="demo-heading">
        <div class="demo-brand"><img src="./ai-travel-logo.svg" alt="" /><div><strong>AiTravel</strong><small>Interactive iPhone app demo</small></div></div>
        <span class="version">V1.0</span>
      </header>
      <section class="phone-space" aria-label="iPhone app preview">
        <div class="phone-holder">
          <div class="phone">
            <div class="display">
              <div class="status-bar" aria-hidden="true">
                <span class="time">9:41</span><span class="island"></span>
                <span class="indicators">
                  <svg width="18" height="13" viewBox="0 0 18 13" fill="currentColor"><rect x="0" y="9" width="3" height="4" rx=".7"/><rect x="5" y="6" width="3" height="7" rx=".7"/><rect x="10" y="3" width="3" height="10" rx=".7"/><rect x="15" y="0" width="3" height="13" rx=".7"/></svg>
                  <svg width="17" height="14" viewBox="0 0 17 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M1 4c4-3.8 11-3.8 15 0M4 7c2.6-2.5 6.4-2.5 9 0M7 10c.9-.8 2.1-.8 3 0"/><circle cx="8.5" cy="12.3" r=".8" fill="currentColor" stroke="none"/></svg>
                  <svg width="27" height="14" viewBox="0 0 27 14" fill="none"><rect x=".7" y="1" width="22" height="12" rx="3" stroke="currentColor" stroke-opacity=".45"/><rect x="3" y="3.2" width="17.5" height="7.6" rx="1.3" fill="currentColor"/><path d="M24 5v4c1.5-.4 1.5-3.6 0-4" fill="currentColor" fill-opacity=".5"/></svg>
                </span>
              </div>
              <iframe id="app-screen" title="AiTravel interactive iPhone app" allow="clipboard-write; web-share"></iframe>
              <div class="home-area" aria-hidden="true"><span class="home-indicator"></span></div>
            </div>
          </div>
        </div>
      </section>
      <footer class="demo-controls">
        <span class="hint">Tap the screen to explore</span>
        <div class="size-switch" role="group" aria-label="Preview size"><button id="fit" type="button" aria-pressed="true">Fit</button><button id="actual" type="button" aria-pressed="false">Full size</button></div>
        <a id="open-app" href="./" target="_blank" rel="noopener">Open full screen ↗</a>
      </footer>
    </main>
    <script>
      const localNativePreview = ["127.0.0.1", "localhost"].includes(location.hostname) && location.port === "4180";
      const entry = new URL(localNativePreview ? "./" : "./app-demo/", location.href);
      const revision = "e586f32d2b913dd5157df5336eb05fe593727dc4";
      if (revision !== "development") entry.searchParams.set("v", revision);
      entry.hash = "/on-trip";
      document.getElementById("app-screen").src = entry.href;
      document.getElementById("open-app").href = entry.href;
      let fullSize = false;
      function fitPhone() {
        const header = document.querySelector(".demo-heading").getBoundingClientRect().height;
        const footer = document.querySelector(".demo-controls").getBoundingClientRect().height;
        const padding = innerWidth <= 480 ? 56 : 84;
        const scale = fullSize ? 1 : Math.min(1, Math.max(.2, (innerWidth - 42) / 413), Math.max(.2, (innerHeight - header - footer - padding) / 872));
        document.documentElement.style.setProperty("--scale", scale);
      }
      function setSize(value) {
        fullSize = value;
        document.body.classList.toggle("full-size", value);
        document.getElementById("fit").setAttribute("aria-pressed", String(!value));
        document.getElementById("actual").setAttribute("aria-pressed", String(value));
        fitPhone();
      }
      document.getElementById("fit").addEventListener("click", () => setSize(false));
      document.getElementById("actual").addEventListener("click", () => setSize(true));
      addEventListener("resize", fitPhone);
      fitPhone();
    </script>
  </body>
</html>
